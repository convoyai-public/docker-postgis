# Pinned repository-managed tools — convoy-postgres (Convoy fork of postgis/docker-postgis).
#
# This is the single source of truth for the versions of the static-validation,
# supply-chain, and release tools used by this repository. `scripts/tools-sync.sh`
# reads this file, downloads the artifact for the current host OS/arch,
# verifies the SHA-256 checksum, and exposes the executable from a gitignored
# repo-local cache (`.tools/cache/<host>/<tool>`). CI and developers resolve to
# the same versions.
#
# Policy reference: convoy-deploy specs/TOOLSPEC.md (`convoy-postgres Tooling`,
# `Tool Pinning & Bootstrap`). Update a pin by editing this file and re-running
# `make tools`; never edit the cache directly.
#
# Supported hosts: darwin/arm64, linux/amd64, linux/arm64.
# markdownlint-cli2 is pinned by OCI image digest (no host Node runtime).
# govulncheck is omitted (N/A) — this repository has no Go code in WU1.
#
# Checksums recorded 2026-07-25 from each project's official release artifacts.

